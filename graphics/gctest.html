<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grand Central Split-Flap Board</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Transit-style font -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="header">
    <span>Gridlock 2026 Event Schedule</span>
  </div>

  <div class="column-labels">
    <span class="col time">TIME</span>
    <span class="col trk">TRK</span>
    <span class="col dest">DESTINATION</span>
    <span class="col remarks">REMARKS</span>
  </div>

  <div id="board"></div>

  <script src="script.js"></script>
</body>

</html>
